name: CI / Release Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test & Publish
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PixelForge.sln

      - name: Build Solution (Release)
        run: dotnet build PixelForge.sln -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/PixelForge.Core.Tests/PixelForge.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish Self-Contained Win-x64 Executable
        run: >
          dotnet publish src/PixelForge.App/PixelForge.App.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Create ZIP Package
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/win-x64/PixelForge.App.exe", "README.md", "LICENSE", "NOTICE" -DestinationPath "publish/win-x64/PixelForge-win-x64.zip" -Force

      - name: Generate latest.json Release Manifest
        shell: pwsh
        run: |
          $exePath = "publish/win-x64/PixelForge.App.exe"
          $zipPath = "publish/win-x64/PixelForge-win-x64.zip"
          if (Test-Path $exePath) {
              $exeHash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()
          } else {
              $exeHash = "none"
          }
          if (Test-Path $zipPath) {
              $zipHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          } else {
              $zipHash = "none"
          }

          $timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = [ordered]@{
              version      = "0.0.1"
              releaseDate  = $timestamp
              releaseNotes = "Релиз PixelForge v0.0.1: слои, инструменты пиксель-арта, симметрия X/Y, Live Preview 1x, палитры и Skia-рендеринг"
              downloadUrl  = "https://github.com/widlily-corp/PixelForge/releases/download/v0.0.1/PixelForge-win-x64.zip"
              exeSha256    = $exeHash
              zipSha256    = $zipHash
          }

          $json = $manifest | ConvertTo-Json -Depth 4
          Set-Content -Path "publish/win-x64/latest.json" -Value $json -Encoding UTF8
          Write-Host "Generated latest.json:"
          Write-Host $json

      - name: Upload Published Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelForge-win-x64-v0.0.1
          path: publish/win-x64/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/win-x64/PixelForge.App.exe
            publish/win-x64/PixelForge-win-x64.zip
            publish/win-x64/latest.json
          name: PixelForge ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
