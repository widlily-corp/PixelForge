name: CI / Release Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test & Publish
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PixelForge.sln

      - name: Build Solution (Release)
        run: dotnet build PixelForge.sln -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/PixelForge.Core.Tests/PixelForge.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish Self-Contained Win-x64 Executable
        run: >
          dotnet publish src/PixelForge.App/PixelForge.App.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Prepare Release Artifacts (WiScripts Standard)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = if ($tag -and $tag.StartsWith("v")) { $tag.Substring(1) } else { "0.0.1" }
          
          # Copy to canonical installer and portable names
          Copy-Item "publish/win-x64/PixelForge.App.exe" -Destination "publish/win-x64/PixelForge_${version}_x64-setup.exe" -Force
          Copy-Item "publish/win-x64/PixelForge.App.exe" -Destination "publish/win-x64/PixelForge.exe" -Force

          # Compute SHA-256
          $setupHash = (Get-FileHash -Path "publish/win-x64/PixelForge_${version}_x64-setup.exe" -Algorithm SHA256).Hash.ToLower()
          $timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          
          # Check for release notes file
          $notes = "PixelForge v$version update released."
          if (Test-Path "RELEASE_NOTES_v$version.md") {
              $notes = Get-Content -Path "RELEASE_NOTES_v$version.md" -Raw
          } elseif (Test-Path "RELEASE_NOTES.md") {
              $notes = Get-Content -Path "RELEASE_NOTES.md" -Raw
          }

          $manifest = [ordered]@{
              version   = $version
              notes     = $notes
              pub_date  = $timestamp
              platforms = [ordered]@{
                  "windows-x86_64" = [ordered]@{
                      url       = "https://github.com/widlily-corp/PixelForge/releases/download/v$version/PixelForge_${version}_x64-setup.exe"
                      signature = ""
                  }
                  "windows-x86_64-setup" = [ordered]@{
                      url       = "https://github.com/widlily-corp/PixelForge/releases/download/v$version/PixelForge_${version}_x64-setup.exe"
                      signature = ""
                  }
              }
              sha256    = $setupHash
              downloadUrl = "https://github.com/widlily-corp/PixelForge/releases/download/v$version/PixelForge_${version}_x64-setup.exe"
          } | ConvertTo-Json -Depth 5

          Set-Content -Path "publish/win-x64/latest.json" -Value $manifest -Encoding UTF8
          Write-Host "Generated WiScripts-compliant latest.json manifest."

      - name: Upload Published Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelForge-win-x64
          path: publish/win-x64/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/win-x64/PixelForge_*_x64-setup.exe
            publish/win-x64/PixelForge.exe
            publish/win-x64/latest.json
          name: PixelForge ${{ github.ref_name }}
          body_path: RELEASE_NOTES_${{ github.ref_name }}.md
          draft: false
          prerelease: false
